<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAKE</title>
    <link href="style.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="./images/STAKE-LOGO-FILE.png">
</head>
<body>
    <h1 id="upgradeHeader">UPGRADES</h1>
    <a href="./index.html">
        <div id="back">X</div>
    </a>
    <p id="points">Strange Orange Boxes: 0</p>
    <div id="boxCenterer">
        <div id="upgradeBox">
            <div id="speedUpgrade">
                <label id="buySpeed">Speed: Worm(LVL 1)</label>
                <div>
                    <button id="speedUpgradeButton">+</button>
                    <button id="speedUpgradeButtonMax">++</button>
                </div>
            </div>
            <div id="headStrengthUpgrade">
                <label id="buyHeadStrength">Head Strength: Weakling(LVL 1)</label>
                <div>
                    <button id="headStrengthUpgradeButton">+</button>
                    <button id="headStrengthUpgradeButtonMax">++</button>
                </div>
            </div>
            <div id="tailStrengthUpgrade">
                <label id="buyTailStrength">Tail Strength: Weakling(LVL 1)</label>
                <div>
                    <button id="tailStrengthUpgradeButton">+</button>
                    <button id="tailStrengthUpgradeButtonMax">++</button>
                </div>
            </div>
            <div id="waveSkippingUpgrade">
                <label id="buyWaveSkip">Wave Skipping: Trash(LVL 1)</label>
                <div>
                    <button id="waveSkippingUpgradeButton">+</button>
                    <button id="waveSkippingUpgradeButtonMax">++</button>
                </div>
            </div>
        </div>
    </div>
    <div id="alertDiv"></div>

    <script src="stakeUpgrades.js" defer></script>
</body>
</html>
